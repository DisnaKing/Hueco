# Producción (compose.prod.yaml): la base de datos, la clave de la agenda y el SMTP llegan por variables de entorno.

# Detrás de Caddy: la IP del cliente viene en X-Forwarded-For. Tomcat solo se fía de ella cuando la petición llega
# desde una red interna (la de Docker), así que desde fuera no se puede falsear. La usa el límite de reservas por IP.
server.forward-headers-strategy=native
