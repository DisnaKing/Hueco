spring.application.name=Hueco

# En desarrollo se carga la peluquería de ejemplo (data-dev.sql).
# En producción hay que arrancar con SPRING_PROFILES_ACTIVE=prod para no cargarla.
spring.profiles.active=dev

hueco.zona-horaria=Europe/Madrid

# Reglas de reserva
# Citas que se pueden atender a la vez
hueco.capacidad=1
# Cada cuantos minutos se ofrece una hora de inicio
hueco.paso-minutos=15
# Preparacion o limpieza despues de cada cita
hueco.margen-minutos=5
# Hasta cuantos dias vista se puede reservar, contando hoy
hueco.dias-vista=30
# Antelacion minima para reservar
hueco.antelacion-minutos=120
