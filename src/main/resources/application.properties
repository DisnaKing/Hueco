spring.application.name=Hueco

# En desarrollo se carga la peluquería de ejemplo (data-dev.sql).
# En producción hay que arrancar con SPRING_PROFILES_ACTIVE=prod para no cargarla.
spring.profiles.active=dev

hueco.zona-horaria=Europe/Madrid

# Reglas de reserva
# Citas que se pueden atender a la vez
hueco.capacidad=1
# Cada cuantos minutos se ofrece una hora de inicio
hueco.paso-minutos=15
# Preparacion o limpieza despues de cada cita
hueco.margen-minutos=5
# Hasta cuantos dias vista se puede reservar, contando hoy
hueco.dias-vista=30
# Antelacion minima para reservar
hueco.antelacion-minutos=120

# Reserva publica como invitado
# Prefijo que se antepone al telefono (solo se aceptan moviles y fijos de Espana)
hueco.prefijo-telefono=+34
# Citas de hoy en adelante que puede tener a la vez un mismo telefono
hueco.max-citas-por-telefono=3
# Reservas por hora desde una misma IP
hueco.max-reservas-por-ip-hora=10
# Hasta cuantas horas antes de la cita se puede cancelar desde la web; despues, llamando
hueco.cancelacion-horas-antes=24

# Emails de cada reserva: confirmacion al cliente (si deja email) y aviso al comercio.
# Se mandan por SMTP con cualquier proveedor (Brevo, Amazon SES, Gmail...). Sin servidor
# (spring.mail.host) o sin remitente no se manda nada y la reserva funciona igual.
#   spring.mail.host / port / username / password (SPRING_MAIL_HOST, SPRING_MAIL_PASSWORD...)
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
# Remitente verificado en el proveedor, por ejemplo: Peluqueria Ejemplo <citas@peluqueria.es>
hueco.email.remitente=
# Nombre del comercio en el asunto, el texto y el .ics adjunto
hueco.email.nombre-comercio=
# Direccion publica de la web, para el enlace a la cita y a la agenda
hueco.email.url-web=
# Quien recibe el aviso de cada cita nueva; vacio: el email del negocio
hueco.email.aviso-comercio=
# Si el envio falla se reintenta, esperando el doble cada vez; al final queda en el log
hueco.email.intentos=3
hueco.email.pausa-reintento=30s
spring.mail.default-encoding=UTF-8

# Acceso del comercio a /agenda y a la gestion de citas y clientes.
# La clave (hueco.agenda.clave-hash, bcrypt) no tiene valor por defecto: sin ella la aplicacion no arranca.
hueco.agenda.usuario=comercio
