spring.application.name=Hueco

# En desarrollo se carga la peluquería de ejemplo (data-dev.sql).
# En producción hay que arrancar con SPRING_PROFILES_ACTIVE=prod para no cargarla.
spring.profiles.active=dev

hueco.zona-horaria=Europe/Madrid

# Reglas de reserva
# Citas que se pueden atender a la vez
hueco.capacidad=1
# Cada cuantos minutos se ofrece una hora de inicio
hueco.paso-minutos=15
# Preparacion o limpieza despues de cada cita
hueco.margen-minutos=5
# Hasta cuantos dias vista se puede reservar, contando hoy
hueco.dias-vista=30
# Antelacion minima para reservar
hueco.antelacion-minutos=120

# Reserva publica como invitado
# Prefijo que se antepone al telefono (solo se aceptan moviles y fijos de Espana)
hueco.prefijo-telefono=+34
# Citas de hoy en adelante que puede tener a la vez un mismo telefono
hueco.max-citas-por-telefono=3
# Reservas por hora desde una misma IP
hueco.max-reservas-por-ip-hora=10

# Acceso del comercio a /agenda y a la gestion de citas y clientes.
# La clave (hueco.agenda.clave-hash, bcrypt) no tiene valor por defecto: sin ella la aplicacion no arranca.
hueco.agenda.usuario=comercio
