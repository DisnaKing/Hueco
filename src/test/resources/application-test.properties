# Postgres de Testcontainers, compartido por todas las clases con el perfil test.
# TC_DAEMON: el contenedor vive hasta que acaba la JVM aunque se cierren las conexiones.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///hueco?TC_DAEMON=true

# Clave de la agenda en los tests: hueco-dev
hueco.agenda.clave-hash=$2a$10$30PwrryLiwhPiQtpsf74z.EwMzmYWp.De8HlduUIR5.hM.neQnRUW

# Todas las peticiones de los tests llegan desde la misma IP: el limite por IP se prueba aparte
hueco.max-reservas-por-ip-hora=1000
